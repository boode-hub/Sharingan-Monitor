name: Bug report
description: Something in the tray app doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what you saw instead. A screenshot or GIF helps.
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2
  - type: dropdown
    id: start
    attributes:
      label: How did you start it?
      options:
        - Run with PowerShell
        - install-startup.bat
        - Command line
  - type: textarea
    id: errors
    attributes:
      label: Error text (if any)
      description: Anything printed in the PowerShell window.
      render: text
